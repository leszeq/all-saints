# ==============================================================================
# Docker Compose – Development Stack
# Encyklopedia Świętych Kościoła Katolickiego
# ==============================================================================

name: all-saints-dev

services:

  # ============================================================
  # DATABASE
  # ============================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: saints-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-all_saints}
      POSTGRES_USER: ${POSTGRES_USER:-saints_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saints_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saints_user} -d ${POSTGRES_DB:-all_saints}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saints-network

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7.2-alpine
    container_name: saints-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - saints-network

  # ============================================================
  # BACKEND – FastAPI
  # ============================================================
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: saints-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-saints_user}:${POSTGRES_PASSWORD:-saints_dev_password}@db:5432/${POSTGRES_DB:-all_saints}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-saints_user}:${POSTGRES_PASSWORD:-saints_dev_password}@db:5432/${POSTGRES_DB:-all_saints}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ../../apps/backend:/app
      - backend_deps:/app/.venv
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - saints-network

  # ============================================================
  # CELERY WORKER
  # ============================================================
  celery-worker:
    profiles: ["ai"]
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: saints-celery-worker
    restart: unless-stopped
    command: python -m celery -A src.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,exports,imports,ai
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-saints_user}:${POSTGRES_PASSWORD:-saints_dev_password}@db:5432/${POSTGRES_DB:-all_saints}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-saints_user}:${POSTGRES_PASSWORD:-saints_dev_password}@db:5432/${POSTGRES_DB:-all_saints}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ../../apps/backend:/app
      - backend_deps:/app/.venv
    depends_on:
      - redis
      - db
    networks:
      - saints-network

  # ============================================================
  # CELERY BEAT (Scheduler)
  # ============================================================
  celery-beat:
    profiles: ["ai"]
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: saints-celery-beat
    restart: unless-stopped
    command: python -m celery -A src.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-saints_user}:${POSTGRES_PASSWORD:-saints_dev_password}@db:5432/${POSTGRES_DB:-all_saints}
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ../../apps/backend:/app
      - backend_deps:/app/.venv
    depends_on:
      - redis
      - db
    networks:
      - saints-network

  # ============================================================
  # FLOWER – Celery Monitoring UI
  # ============================================================
  flower:
    profiles: ["ai"]
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: saints-flower
    restart: unless-stopped
    command: python -m celery -A src.workers.celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-admin:flower_dev_password}
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    volumes:
      - ../../apps/backend:/app
      - backend_deps:/app/.venv
    depends_on:
      - redis
      - celery-worker
    networks:
      - saints-network

  # ============================================================
  # MINIO – Object Storage (S3-compatible)
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: saints-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - saints-network

  # ============================================================
  # MAILHOG – Email Testing (dev only)
  # ============================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: saints-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - saints-network

