#      - saints-network

  # ============================================================
  # WEB – Next.js Public Frontend
  # ============================================================
#  web:
#    build:
#      context: ../../apps/web
#      dockerfile: Dockerfile
#      target: development
#    container_name: saints-web
#    restart: unless-stopped
#    env_file:
#      - .env
#    environment:
#      NEXT_PUBLIC_API_URL: http://localhost:8000
#    volumes:
#      - ../../apps/web:/app
#      - web_node_modules:/app/node_modules
#    ports:
#      - "3000:3000"
#    depends_on:
#      - backend
#    networks:
#      - saints-network

  # ============================================================
  # PROMETHEUS
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: saints-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ../../infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - saints-network

  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: saints-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3002
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    networks:
      - saints-network

