# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  postgres_data:
    name: saints_postgres_data
  redis_data:
    name: saints_redis_data
  minio_data:
    name: saints_minio_data
  prometheus_data:
    name: saints_prometheus_data
  grafana_data:
    name: saints_grafana_data
  backend_deps:
    name: saints_backend_deps
  admin_node_modules:
    name: saints_admin_node_modules
  web_node_modules:
    name: saints_web_node_modules

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  saints-network:
    name: saints-network
    driver: bridge
